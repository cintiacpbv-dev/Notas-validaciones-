name: Compilar APK

on:
  push:
    paths:
      - 'web/**'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Llave de firma (secretos opcionales)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK firmado
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/MisNotas-1.0.${{ github.run_number }}.apk"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MisNotas-apk
          path: MisNotas-*.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mis Notas 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: MisNotas-*.apk
          body: |
            📱 **Instalar en Android:** descarga `MisNotas-1.0.${{ github.run_number }}.apk` desde *Assets*, ábrelo en tu celular o tablet y permite "instalar apps de origen desconocido" si te lo pide.

            Rama: `${{ github.ref_name }}` · Commit: ${{ github.sha }}
