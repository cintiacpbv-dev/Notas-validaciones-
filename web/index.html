<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Mis Notas">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#F3F2EE">
    <meta name="description" content="Editor de validaciones sobre PDF y agenda personal de notas">
    <title>Mis Notas</title>
    <link rel="icon" type="image/svg+xml" href="icons/schnauzer.svg">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/validaciones.css">
    <link rel="stylesheet" href="css/agenda.css">
    <script src="vendor/pdf.min.js"></script>
    <script src="vendor/localforage.min.js"></script>
    <script src="vendor/jszip.min.js"></script>
</head>
<body>
    <div class="app-shell">
        <!-- Navegación principal: barra inferior en celular, riel lateral en tablet/PC -->
        <nav class="main-nav" id="main-nav" aria-label="Secciones">
            <div class="nav-brand">
                <img src="icons/schnauzer.svg" alt="" class="nav-logo">
                <span class="nav-brand-text">Mis Notas</span>
            </div>
            <button class="nav-item active" data-section="validaciones">
                <i data-icon="clipboard"></i><span class="nav-label">Validaciones</span>
            </button>
            <button class="nav-item" data-section="agenda">
                <i data-icon="bow"></i><span class="nav-label">Mi Agenda</span>
            </button>
            <div class="nav-spacer"></div>
            <button class="nav-item nav-item-theme js-theme-toggle" title="Cambiar tema">
                <span class="js-theme-icon"></span><span class="nav-label js-theme-label">Tema</span>
            </button>
        </nav>

        <main class="app-main">
            <!-- ============ VALIDACIONES ============ -->
            <section id="section-validaciones" class="section vx">
                <!-- Panel de proyectos -->
                <div id="vx-dashboard" class="vx-view">
                    <header class="vx-head">
                        <div class="vx-head-title">
                            <h1>Validaciones</h1>
                            <p class="vx-muted" id="vx-summary"></p>
                        </div>
                        <div class="vx-head-actions">
                            <button class="vx-sync" id="vx-sync" title="Nube y dispositivo"></button>
                            <button class="vx-btn vx-btn-quiet" id="vx-import" title="Importar proyecto (.json) o respaldo (.zip)"><i data-icon="upload"></i><span>Importar</span></button>
                            <button class="vx-btn vx-btn-icon" id="vx-dash-more" title="Más opciones" aria-label="Más opciones"><i data-icon="more"></i></button>
                            <button class="vx-btn vx-btn-primary" id="vx-new" title="Nuevo proyecto"><i data-icon="plus"></i><span>Nuevo proyecto</span></button>
                        </div>
                    </header>
                    <div class="vx-filters">
                        <label class="vx-search"><i data-icon="search"></i><input type="search" id="vx-search" placeholder="Buscar proyecto o documento" aria-label="Buscar"></label>
                        <div class="vx-seg" id="vx-filter" role="tablist">
                            <button data-f="all" class="is-on">Todos</button>
                            <button data-f="active">En curso</button>
                            <button data-f="done">Completados</button>
                        </div>
                        <label class="vx-select" title="Ordenar"><i data-icon="sort"></i>
                            <select id="vx-sort" aria-label="Ordenar">
                                <option value="recent">Recientes</option>
                                <option value="name">Nombre</option>
                                <option value="pending">Más pendientes</option>
                            </select>
                        </label>
                    </div>
                    <div class="vx-scroll">
                        <div class="vx-table-head" id="vx-table-head" aria-hidden="true"><span>Proyecto</span><span>Documento</span><span>Avance</span><span>Actualizado</span><span></span></div>
                        <div class="vx-list" id="vx-list"></div>
                    </div>
                    <div class="vx-drop" id="vx-drop"><div><i data-icon="filePlus"></i><p>Suelta el PDF para crear un proyecto</p></div></div>
                </div>

                <!-- Editor de revisión -->
                <div id="vx-editor" class="vx-view hidden">
                    <header class="vx-ebar">
                        <button class="vx-btn vx-btn-icon" id="vx-back" title="Volver a proyectos" aria-label="Volver a proyectos"><i data-icon="arrowLeft"></i></button>
                        <div class="vx-ebar-title">
                            <input id="vx-title" class="vx-title-input" aria-label="Nombre del proyecto" spellcheck="false" autocomplete="off">
                            <span id="vx-docline" class="vx-muted"></span>
                        </div>
                        <div class="vx-pager">
                            <button class="vx-btn vx-btn-icon" id="vx-prev" title="Página anterior (←)" aria-label="Página anterior"><i data-icon="chevronLeft"></i></button>
                            <label class="vx-pageno"><input id="vx-page" inputmode="numeric" value="1" aria-label="Página actual"><span>/ <b id="vx-pages">–</b></span></label>
                            <button class="vx-btn vx-btn-icon" id="vx-next" title="Página siguiente (→)" aria-label="Página siguiente"><i data-icon="chevronRight"></i></button>
                        </div>
                        <div class="vx-zoom">
                            <button class="vx-btn vx-btn-icon" id="vx-zoom-out" title="Alejar (Ctrl −)" aria-label="Alejar"><i data-icon="zoomOut"></i></button>
                            <button class="vx-zoom-level" id="vx-zoom-level" title="Ajustar a la pantalla">100%</button>
                            <button class="vx-btn vx-btn-icon" id="vx-zoom-in" title="Acercar (Ctrl +)" aria-label="Acercar"><i data-icon="zoomIn"></i></button>
                            <button class="vx-btn vx-btn-icon" id="vx-fit" title="Ajustar al ancho" aria-label="Ajustar al ancho"><i data-icon="fitWidth"></i></button>
                        </div>
                        <div class="vx-ebar-actions">
                            <button class="vx-sync vx-sync-compact" id="vx-sync-mini" title="Nube y dispositivo"></button>
                            <button class="vx-btn vx-btn-quiet" id="vx-share" title="Compartir y exportar"><i data-icon="share"></i><span>Compartir</span></button>
                            <button class="vx-btn vx-btn-quiet vx-panel-btn" id="vx-panel-btn" title="Observaciones" aria-pressed="false"><i data-icon="list"></i><span>Observaciones</span><em id="vx-open-count">0</em></button>
                        </div>
                    </header>
                    <div class="vx-work" id="vx-work">
                        <nav class="vx-tools" id="vx-tools" aria-label="Herramientas"></nav>
                        <div class="vx-stage-wrap">
                            <div class="vx-hint hidden" id="vx-hint"><i data-icon="marker"></i><span id="vx-hint-text"></span><button id="vx-hint-cancel">Cancelar</button></div>
                            <div class="vx-stage" id="vx-stage">
                                <div id="vx-nodoc" class="vx-nodoc hidden"></div>
                                <div id="pdf-container" class="vx-page hidden">
                                    <canvas id="pdf-canvas"></canvas>
                                    <div class="textLayer" id="pdf-text-layer"></div>
                                    <div class="vx-annot-layer" id="annotation-layer"></div>
                                </div>
                            </div>
                        </div>
                        <div class="vx-scrim" id="vx-scrim"></div>
                        <aside class="vx-panel" id="vx-panel" aria-label="Observaciones">
                            <div class="vx-sheet-handle"></div>
                            <div id="vx-panel-list" class="vx-panel-body"></div>
                            <div id="vx-panel-detail" class="vx-panel-body hidden"></div>
                        </aside>
                    </div>
                    <button class="vx-selchip hidden" id="vx-selchip"><i data-icon="strike"></i>Tachar y reemplazar</button>
                    <input type="file" id="vx-file-photo" accept="image/*" capture="environment" hidden>
                    <input type="file" id="vx-file-video" accept="video/*" capture="environment" hidden>
                    <input type="file" id="vx-file-gallery" accept="image/*,video/*" hidden>
                    <input type="file" id="vx-file-pdf" accept="application/pdf,.pdf" hidden>
                </div>
                <input type="file" id="vx-file-import" accept=".json,.zip,application/json,application/zip" hidden>
            </section>

            <!-- ============ AGENDA ============ -->
            <section id="section-agenda" class="section kawaii hidden">
                <header class="k-header">
                    <div class="k-title">
                        <svg class="k-bow" viewBox="0 0 64 40" aria-hidden="true"><path d="M32 20C22 4 4 2 4 20s18 16 28 0z" /><path d="M32 20C42 4 60 2 60 20s-18 16-28 0z" /><circle cx="32" cy="20" r="7" class="k-bow-knot" /></svg>
                        <h1>Mi Agenda</h1>
                    </div>
                    <div class="k-header-actions">
                        <input type="search" id="k-search" class="k-search" placeholder="🔍 Buscar notas...">
                        <button class="k-btn k-btn-primary" id="k-new-note">＋<span class="hide-xs"> Nota</span></button>
                    </div>
                </header>

                <div class="k-scroll" id="k-scroll">
                    <div class="k-hero" id="k-hero">
                        <img src="icons/schnauzer.svg" alt="" class="k-mascot">
                        <div class="k-hero-text">
                            <p class="k-greeting" id="k-greeting" title="Toca para poner tu nombre">¡Hola!</p>
                            <p class="k-today" id="k-today"></p>
                            <p class="k-summary" id="k-summary"></p>
                        </div>
                        <span class="k-deco k-deco-1">♥</span><span class="k-deco k-deco-2">★</span><span class="k-deco k-deco-3">✿</span>
                    </div>

                    <div class="k-tabs" role="tablist">
                        <button class="k-tab active" data-tab="notes" role="tab">📝 Notas</button>
                        <button class="k-tab" data-tab="calendar" role="tab">📅 Calendario</button>
                        <button class="k-tab" data-tab="todo" role="tab">✅ Pendientes</button>
                    </div>

                    <div class="k-panel" id="k-panel-notes">
                        <div class="k-chips" id="k-chips"></div>
                        <div id="k-notes"></div>
                    </div>

                    <div class="k-panel hidden" id="k-panel-calendar">
                        <div class="k-cal-layout">
                            <div class="k-cal">
                                <div class="k-cal-head">
                                    <button class="k-icon-btn" id="k-cal-prev" title="Mes anterior">◀</button>
                                    <h2 id="k-cal-title"></h2>
                                    <button class="k-icon-btn" id="k-cal-next" title="Mes siguiente">▶</button>
                                </div>
                                <div class="k-cal-grid k-cal-weekdays"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
                                <div class="k-cal-grid" id="k-cal-days"></div>
                                <button class="k-link" id="k-cal-today">Ir a hoy 🎀</button>
                            </div>
                            <div class="k-day">
                                <div class="k-day-head">
                                    <h3 id="k-day-title"></h3>
                                    <button class="k-btn k-btn-small" id="k-day-add">＋ Nota este día</button>
                                </div>
                                <div id="k-day-notes"></div>
                            </div>
                        </div>
                    </div>

                    <div class="k-panel hidden" id="k-panel-todo">
                        <div id="k-todo"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/store.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/share.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/agenda.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
